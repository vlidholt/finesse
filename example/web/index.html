<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Una: over a hundred components for Flutter that adapt across desktop, mobile and web, with a theme editor, docs and Liquid Glass on Apple platforms.">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Una">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <title>Una: Flutter UI components</title>
  <meta name="theme-color" content="#4B71A8">
  <link rel="manifest" href="manifest.json">

  <!-- Link previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Una">
  <meta property="og:title" content="Una: Flutter UI components">
  <meta property="og:description" content="Una: over a hundred components for Flutter that adapt across desktop, mobile and web, with a theme editor, docs and Liquid Glass on Apple platforms.">
  <meta property="og:url" content="https://vlidholt.github.io/una/">
  <meta property="og:image" content="https://vlidholt.github.io/una/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="The Una logo, a white U on a slate-blue tile">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Una: Flutter UI components">
  <meta name="twitter:description" content="Una: over a hundred components for Flutter that adapt across desktop, mobile and web, with a theme editor, docs and Liquid Glass on Apple platforms.">
  <meta name="twitter:image" content="https://vlidholt.github.io/una/icons/Icon-512.png">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
