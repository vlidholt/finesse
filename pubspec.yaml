name: una
description: >-
  A themeable Flutter design system: 60+ widgets, frosted-glass surfaces,
  desktop and mobile metrics in one theme, Liquid Glass on iOS and macOS,
  and no Material dependency.
version: 0.1.0
homepage: https://github.com/vlidholt/una
repository: https://github.com/vlidholt/una
issue_tracker: https://github.com/vlidholt/una/issues
topics:
  - user-interface
  - design-system
  - theming
  - material-alternative
  - widgets
screenshots:
  - description: Strand, the demo app built with una.
    path: assets/screenshot.png

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  boxy: ^2.1.2
  collection: ^1.18.0
  # The package's glyphs (chevrons, the search field's magnifier) are
  # CupertinoIcons; without the font they draw as boxes.
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  # Liquid Glass on iOS and macOS. Only lib/src/liquid_glass/ imports it
  # (and, through it, Cupertino): see CLAUDE.md, "Liquid Glass".
  liquid_glass_widgets: ^1.21.0
  slang: ^4.19.0
  slang_flutter: ^4.19.0
  theme_extensions_builder_annotation: ^7.1.0
  # Re-exported in part: UnaTableCell extends TableViewCell.
  two_dimensional_scrollables: ^0.5.3
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.12.2
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  slang_build_runner: ^4.19.0
  theme_extensions_builder: ^7.1.0
  very_good_analysis: ^10.0.0

flutter:
  # The Phosphor icon fonts, copied unchanged from phosphor_flutter 2.1.0.
  # MIT licensed: see fonts/phosphor/LICENSE and this package's LICENSE.
  # They are the only fonts una bundles; text uses the platform font.
  fonts:
    - family: PhosphorRegular
      fonts:
        - asset: fonts/phosphor/Phosphor.ttf
    - family: PhosphorBold
      fonts:
        - asset: fonts/phosphor/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: fonts/phosphor/Phosphor-Fill.ttf
    - family: PhosphorLight
      fonts:
        - asset: fonts/phosphor/Phosphor-Light.ttf
    - family: PhosphorThin
      fonts:
        - asset: fonts/phosphor/Phosphor-Thin.ttf
    - family: PhosphorDuotone
      fonts:
        - asset: fonts/phosphor/Phosphor-Duotone.ttf
