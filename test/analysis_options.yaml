# The tests build their Material harnesses from the SDK's own Material and
# Cupertino libraries, which Flutter deprecated in 3.47 in favour of the
# `material_ui` and `cupertino_ui` packages. `lib/material.dart` wraps the SDK
# libraries on purpose (see its library comment), so the tests do too; the
# deprecation is silenced here rather than in the package's own options, where
# it should keep reporting anything else that is deprecated.
include: ../analysis_options.yaml

analyzer:
  errors:
    deprecated_member_use: ignore
